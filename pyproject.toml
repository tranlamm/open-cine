[project]
name = "opencine"
version = "0.1.0"
description = "Agent-directed video engine: short-form edits, generated films and character swaps over MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "assets/fonts/*-OFL.txt"]
requires-python = ">=3.12"
keywords = ["mcp", "agent-skills", "video-editing", "video-generation", "huggingface", "zerogpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.4",
    "imagehash>=4.3",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "gradio-client>=1.3",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# SAM 2.1 mask wipes through onnxruntime (DirectML GPU build on Windows)
mask = [
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
]
# scribble targets: Florence-2 finds a named thing, EdgeTAM tracks its mask
vision = ["opencine[mask]", "tokenizers>=0.20"]

[project.urls]
Homepage = "https://github.com/tranlamm/open-cine"
Issues = "https://github.com/tranlamm/open-cine/issues"

[project.scripts]
opencine = "opencine.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencine"]

[tool.ruff]
line-length = 100
src = ["src"]
# code that runs on the Space duplicates, in the upstream files' namespace
extend-exclude = ["src/opencine/gen/spaces/*/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
